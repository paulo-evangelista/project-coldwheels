app = "mugen-cartracker"

[build]
image = "registry.fly.io/mugen-cartracker:latest"

[http_service]
internal_port = 10000
force_https = true

[http_service.concurrency]
type = "requests"
soft_limit = 200
hard_limit = 250

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/healthz"

[[vm]]
size = "shared-cpu-1x"
memory = "2gb"

[env]
CARTESI_BLOCKCHAIN_FINALITY_OFFSET = "1"
CARTESI_BLOCKCHAIN_ID = "421614"
CARTESI_CONTRACTS_APPLICATION_ADDRESS = "0xcec7C558be4E7Ad2a55F24b3dfb1C24c28a62A5C"
CARTESI_CONTRACTS_AUTHORITY_ADDRESS = "0x0F460B74a605c5e8631ACc283ac365b703a56a0d"
CARTESI_CONTRACTS_HISTORY_ADDRESS = "0x84c511e965e3eFf1533E29004C221f62a8DC386D"
CARTESI_CONTRACTS_INPUT_BOX_ADDRESS = "0x59b22D57D4f067708AB0c00552767405926dc768"
CARTESI_CONTRACTS_INPUT_BOX_DEPLOYMENT_BLOCK_NUMBER = "2838409"
CARTESI_EPOCH_LENGTH = "43200"